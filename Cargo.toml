[package]
name = "greentic-operala"
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/greenticai/greentic-operala"
homepage = "https://github.com/greenticai/greentic-operala"
documentation = "https://docs.rs/greentic-operala"
readme = "README.md"
description = "OperaLa authoring tools for Greentic operational business logic handoff artifacts."
keywords = ["greentic", "operala", "operations", "wizard"]
categories = ["development-tools", "command-line-utilities"]
include = ["build.rs", "src/**", "extensions/**", "i18n/**", "schemas/**", "Cargo.toml", "README.md", "LICENSE"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ name }-v{ version }-{ target }"
pkg-fmt = "tgz"
bin = ["greentic-operala"]

[features]
# default enables CLI binary + native deps (clap, qa-lib)
default = ["cli"]
# cli feature gates clap, greentic-qa-lib, and the binary entry-point
cli = ["dep:clap", "dep:greentic-qa-lib"]

[dependencies]
# clap: CLI-only; gated behind the `cli` feature
clap = { version = "4.5", features = ["derive"], optional = true }
blake3 = "1"
# greentic-llm: base import (types only); native-target table adds rig + clap features.
greentic-llm = { version = "1.0.1", default-features = false }
# greentic-pack: base import (types only, wasm-safe); native-target table adds native feature.
greentic-pack = { package = "greentic-pack-lib", version = "=1.1.0-dev.0", default-features = false }
# greentic-qa-lib: CLI/native-only wizard runner; gates behind `cli` feature (not wasm-safe).
greentic-qa-lib = { version = "0.5", optional = true }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
# chrono+cron: vendored trigger-schedule vocabulary (src/business_events/schedule.rs).
# operala cannot depend on greentic-triggers directly (greentic-types release-train
# conflict); these two crates do not pull greentic-types themselves.
chrono = { version = "0.4", features = ["clock", "serde"] }
cron = "0.16"

# Native-only heavy dependencies: LLM rig backend, pack native machinery, async runtime.
# Cargo unions these features with the base [dependencies] entries above.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
greentic-llm = { version = "1.0.1", features = ["rig", "clap"] }
greentic-pack = { package = "greentic-pack-lib", version = "=1.1.0-dev.0", features = ["native"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
greentic-llm = { version = "1.0.1", features = ["test-mock"] }
zip = "8"

[lib]
name = "greentic_operala"
path = "src/lib.rs"

[[bin]]
name = "greentic-operala"
path = "src/main.rs"
required-features = ["cli"]

[workspace]
members = ["crates/greentic-operala-designer-extension"]

