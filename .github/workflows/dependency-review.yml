name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dep-review:
    uses: greenticai/.github/.github/workflows/dependency-review.yml@main
    # Kept: the org reusable workflow could not be inspected from here to confirm
    # it needs no secrets. Drop once verified, to follow least privilege.
    secrets: inherit
